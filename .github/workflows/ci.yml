# Checks every push and pull request, and every release before it is published.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check ozzyhn.ps1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Static checks (ASCII, syntax, XAML, no downloads, PSScriptAnalyzer)
        shell: powershell
        run: .\.github\scripts\check-script.ps1 -Path ozzyhn.ps1

      - name: Data folder stays locked to administrators
        shell: powershell
        run: .\.github\scripts\test-datadir.ps1 -Path ozzyhn.ps1

      - name: Every tweak applies and reverts cleanly
        shell: powershell
        run: .\.github\scripts\test-tweaks.ps1 -Path ozzyhn.ps1

      - name: Quick clean stays inside its folders (no links, no other drives)
        shell: powershell
        run: .\.github\scripts\test-cleanup.ps1 -Path ozzyhn.ps1

      - name: Games page reads settings files correctly
        shell: powershell
        run: .\.github\scripts\test-games.ps1 -Path ozzyhn.ps1

      - name: App window opens and every page works (normal and small laptop screen)
        shell: powershell
        run: .\.github\scripts\test-ui.ps1 -Path ozzyhn.ps1

      - name: THEMES page works with real Rainmeter (skins load without errors, then are removed)
        shell: powershell
        run: .\.github\scripts\test-themes.ps1 -Path ozzyhn.ps1

      - name: Launcher runs the latest release, or the local copy offline
        if: github.event_name != 'pull_request'
        shell: powershell
        run: .\.github\scripts\test-launcher.ps1 -Cmd Run-Ozzyhn.cmd
