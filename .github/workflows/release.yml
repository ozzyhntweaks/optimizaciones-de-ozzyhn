# Publishes a release whenever $Oz.Version in ozzyhn.ps1 changes on main (or when a tag like
# v1.1.2 is pushed, which must match $Oz.Version). To release: bump $Oz.Version, push to main.
# The same checks as CI run first. The release gets the files users download, SHA256SUMS.txt,
# and a GitHub build attestation for each file.
# Only the newest release is kept: once it is published, older releases and their version tags
# are deleted. The full history stays in CHANGELOG.md.
name: Release

on:
  push:
    branches: [main]
    paths: [ozzyhn.ps1, Run-Ozzyhn.cmd, .github/workflows/release.yml]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Is this a new version?
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n "s/^\$Oz\.Version *= *'\([0-9.]*\)'.*/\1/p" ozzyhn.ps1 | head -n 1)
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$version" ]; then echo "::error::\$Oz.Version not found in ozzyhn.ps1"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match \$Oz.Version = '$version' in ozzyhn.ps1"
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists, nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif ! grep -qx "## $version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section. Add one with the release notes, then push again."
            exit 1
          else
            echo "New version $tag will be released."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    needs: [version, check]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and its tag
      id-token: write      # sign the build attestation
      attestations: write  # store the build attestation
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Hash the release files
        run: sha256sum ozzyhn.ps1 Run-Ozzyhn.cmd | tee SHA256SUMS.txt

      - name: Attest where the files were built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ozzyhn.ps1
            Run-Ozzyhn.cmd

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          version="${TAG#v}"
          {
            # This version's section of CHANGELOG.md
            awk -v h="## $version" '$0 == h { on = 1; next } on && /^## / { exit } on' CHANGELOG.md
            echo
            echo "---"
            echo
            echo "Launch from PowerShell as Administrator:"
            echo
            echo '```powershell'
            echo "irm https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/ozzyhn.ps1 | iex"
            echo '```'
            echo
            echo "SHA-256:"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo "Check a downloaded copy with \`Get-FileHash .\\ozzyhn.ps1\` or \`gh attestation verify .\\ozzyhn.ps1 --repo ${GITHUB_REPOSITORY}\`."
          } > notes.md
          gh release create "$TAG" ozzyhn.ps1 Run-Ozzyhn.cmd SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Optimizaciones de Ozzyhn $TAG" \
            --notes-file notes.md

  cleanup:
    # After a new release is published (or when run by hand from the Actions tab), every older
    # release and version tag is removed, so only the newest version is listed.
    name: Keep only the newest release
    needs: [version, release]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.version.outputs.publish == 'false')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove older releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Stops here (deleting nothing) unless the newest release really exists
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '"Keeping release " + .tag_name'
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name != \"$TAG\") | \"\(.id) \(.tag_name)\"" |
            while read -r id name; do
              echo "Deleting release $name"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq ".[] | select(.ref != \"refs/tags/$TAG\") | .ref" |
            while read -r ref; do
              echo "Deleting tag ${ref#refs/tags/}"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/$ref"
            done
