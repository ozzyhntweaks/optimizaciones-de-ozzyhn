# Publishes a release when a version tag is pushed, for example:
#   git tag v1.1.2 && git push origin v1.1.2
# The tag must match $Oz.Version in ozzyhn.ps1. The same checks as CI run first. The release
# gets the files users download, SHA256SUMS.txt, and a GitHub build attestation for each file.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the build attestation
      attestations: write  # store the build attestation
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Tag matches the version in ozzyhn.ps1
        run: |
          version=$(sed -n "s/^\$Oz\.Version *= *'\([0-9.]*\)'.*/\1/p" ozzyhn.ps1 | head -n 1)
          echo "Script version: $version, tag: $GITHUB_REF_NAME"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match \$Oz.Version = '$version' in ozzyhn.ps1"
            exit 1
          fi

      - name: Hash the release files
        run: |
          sha256sum ozzyhn.ps1 Run-Ozzyhn.cmd | tee SHA256SUMS.txt

      - name: Attest where the files were built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ozzyhn.ps1
            Run-Ozzyhn.cmd

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Launch from PowerShell as Administrator:"
            echo
            echo '```powershell'
            echo "irm https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/ozzyhn.ps1 | iex"
            echo '```'
            echo
            echo "SHA-256:"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo "Check a downloaded copy with \`Get-FileHash .\\ozzyhn.ps1\` or \`gh attestation verify .\\ozzyhn.ps1 --repo ${GITHUB_REPOSITORY}\`."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" ozzyhn.ps1 Run-Ozzyhn.cmd SHA256SUMS.txt \
            --title "Optimizaciones de Ozzyhn $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
