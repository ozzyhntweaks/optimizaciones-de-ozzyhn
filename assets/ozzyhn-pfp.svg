<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <!-- OZZYHN TWEAKS profile picture: neon OZ hex mark (same geometry as the app logo) -->
  <defs>
    <linearGradient id="neon" x1="10" y1="0" x2="90" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.55" stop-color="#8A5CFF"/>
      <stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#10345F" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#05070D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#78146E" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#05070D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="6.25" height="6.25" patternUnits="userSpaceOnUse">
      <path d="M6.25 0 L0 0 0 6.25" fill="none" stroke="#1E3764" stroke-opacity="0.45" stroke-width="0.15"/>
    </pattern>
    <filter id="blurWide" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2"/></filter>
    <filter id="blurTight" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.1"/></filter>
    <g id="hex" transform="translate(8 8) scale(0.84)">
      <path d="M50,4 L89.84,27 L89.84,73 L50,96 L10.16,73 L10.16,27 Z" fill="none" stroke="url(#neon)" stroke-width="5.2" stroke-linejoin="round"/>
    </g>
    <g id="mark" transform="translate(8 8) scale(0.84)">
      <path fill-rule="evenodd" d="M29,33 L39,33 L46,40 L46,60 L39,67 L29,67 L22,60 L22,40 Z M31,40 L37,40 L39,42 L39,58 L37,60 L31,60 L29,58 L29,42 Z M54,33 L78,33 L78,40 L63.5,60 L78,60 L78,67 L54,67 L54,60 L68.5,40 L54,40 Z"/>
    </g>
  </defs>
  <rect width="100" height="100" fill="#05070D"/>
  <rect width="100" height="100" fill="url(#glowA)"/>
  <rect width="100" height="100" fill="url(#glowB)"/>
  <rect width="100" height="100" fill="url(#grid)"/>
  <path transform="translate(8 8) scale(0.84)" d="M50,4 L89.84,27 L89.84,73 L50,96 L10.16,73 L10.16,27 Z" fill="#00E5FF" fill-opacity="0.13"/>
  <use href="#hex" filter="url(#blurWide)" opacity="0.85"/>
  <use href="#hex" filter="url(#blurTight)"/>
  <use href="#hex"/>
  <use href="#mark" fill="#00E5FF" filter="url(#blurTight)" opacity="0.55"/>
  <use href="#mark" fill="#E6F1FF"/>
</svg>
